[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chesscoach"
version = "0.0.1"
description = "Coach d'échecs local et opensource construit sur vos parties Chess.com"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "chess>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chesscoach-ingest = "chesscoach.ingest.chesscom:main"

[tool.setuptools.packages.find]
include = ["chesscoach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
